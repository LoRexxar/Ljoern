  <body>
    <header>
      <div class="wrap">
        <div class="title">
          <h1>php2cpg vs pysrc2cpg：节点与属性对比</h1>
        </div>
        <div class="subtitle">
          聚焦两者都会大量生成、且对跨语言一致性影响最大的节点类型；每个节点给出属性填充方式、生成入口与差异点。
        </div>
        <div class="controls">
          <input id="q" class="input" placeholder="搜索节点类型/差异关键词（例如 METHOD、methodFullName、evaluationStrategy、namespace）" />
          <label class="toggle"><input id="onlyDiff" type="checkbox" checked />只看差异明显</label>
          <label class="toggle"><input id="group" type="checkbox" />按严重度分组</label>
          <button id="reset" class="btn">重置</button>
        </div>
        <div class="legend">
          <span class="pill"><span class="dot good"></span>差异小（基本一致）</span>
          <span class="pill"><span class="dot warn"></span>差异中（字段缺失/策略不同）</span>
          <span class="pill"><span class="dot bad"></span>差异大（会影响对齐重构与跨语言查询）</span>
        </div>
      </div>
    </header>

        </div>
      </div>

            "py localNode": "file:///d:/program/Ljoern/joern-cli/frontends/pysrc2cpg/src/main/scala/io/joern/pysrc2cpg/NodeBuilder.scala#L306-L314",
            "AstNodeBuilder.localNode": "file:///d:/program/Ljoern/joern-cli/frontends/x2cpg/src/main/scala/io/joern/x2cpg/AstNodeBuilder.scala#L309-L327"
          }
        },
        {
          nodeType: "CONTROL_STRUCTURE",
          severity: "warn",
          python: {
            "生成入口": "NodeBuilder.controlStructureNode",
            "parserTypeName": "未填",
            "controlStructureType": "填",
            "pos": "line/col/offset"
          },
          php: {
            "生成入口": "AstNodeBuilder.controlStructureNode",
            "parserTypeName": "node.getClass.getSimpleName",
            "controlStructureType": "填",
            "pos": "line/col/offset"
          },
          diffs: [
            "py 缺 parserTypeName，影响某些调试/可视化一致性"
          ],
          refs: {
            "py controlStructureNode": "file:///d:/program/Ljoern/joern-cli/frontends/pysrc2cpg/src/main/scala/io/joern/pysrc2cpg/NodeBuilder.scala#L290-L304",
            "AstNodeBuilder.controlStructureNode": "file:///d:/program/Ljoern/joern-cli/frontends/x2cpg/src/main/scala/io/joern/x2cpg/AstNodeBuilder.scala#L277-L285"

        {
          nodeType: "JUMP_TARGET",

          diffs: [
            "py 的 jumpTarget 缺位置信息与 parserTypeName"

          refs: {

      function norm(s) {
        return String(s ?? "").toLowerCase();
      }

      function matchesQuery(item, q) {
        if (!q) return true;
        const hay = [
          item.nodeType,
          ...Object.keys(item.python || {}),
          ...Object.values(item.python || {}),
          ...Object.keys(item.php || {}),
          ...Object.values(item.php || {}),
          ...(item.diffs || [])
        ].map(norm).join(" ");
        return hay.includes(norm(q));
      }

      function severityLabel(sev) {
        if (sev === "good") return ["差异小", "good"];
        if (sev === "warn") return ["差异中", "warn"];
        return ["差异大", "bad"];
      }

      function escapeHtml(s) {
        return String(s ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function kvHtml(obj) {
        const entries = Object.entries(obj || {});
        if (!entries.length) return "";
        return `
          <div class="kv">
            ${entries
              .map(([k, v]) => `<div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div>`)
              .join("")}
          </div>
        `;
      }

      function refsHtml(refs) {
        const entries = Object.entries(refs || {});
        if (!entries.length) return "";
        return `
          <div class="refs">
            ${entries
              .map(([k, url]) => `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">${escapeHtml(k)}</a>`)
              .join("")}
          </div>
        `;
      }

      function cardHtml(item) {
        const [label, cls] = severityLabel(item.severity);
        return `
          <section class="card" data-severity="${escapeHtml(item.severity)}">
            <div class="cardHead">
              <div class="cardTitle">
                <div class="nodeType">${escapeHtml(item.nodeType)}</div>
                <div class="severity ${escapeHtml(cls)}">${escapeHtml(label)}</div>
              </div>
            </div>
            <div class="cardBody">
              <div class="grid2">
                <div class="box">
                  <h3>pysrc2cpg</h3>
                  ${kvHtml(item.python)}
                </div>
                <div class="box">
                  <h3>php2cpg</h3>
                  ${kvHtml(item.php)}
                </div>
              </div>
              <div class="diff">
                <div style="font-weight:650; color: rgba(170, 179, 208, 0.95);">差异点</div>
                <ul>
                  ${(item.diffs || []).map(d => `<li>${escapeHtml(d)}</li>`).join("")}
                </ul>
                ${refsHtml(item.refs)}
              </div>
            </div>
          </section>
        `;
      }

      function render() {
        const q = document.getElementById("q").value.trim();
        const onlyDiff = document.getElementById("onlyDiff").checked;
        const group = document.getElementById("group").checked;

        let items = data.filter(it => matchesQuery(it, q));
        if (onlyDiff) items = items.filter(it => it.severity !== "good");

        const countEl = document.getElementById("count");
        countEl.textContent = `当前展示：${items.length} 项（共 ${data.length} 项）`;

        const container = document.getElementById("cards");
        if (!group) {
          container.innerHTML = items.map(cardHtml).join("");
          return;
        }

        const order = ["bad", "warn", "good"];
        const groups = new Map(order.map(s => [s, []]));
        items.forEach(it => groups.get(it.severity)?.push(it));

        const groupTitles = {
          bad: "差异大（优先对齐）",
          warn: "差异中（建议对齐）",
          good: "差异小（可后置）"
        };

        container.innerHTML = order
          .map(sev => {
            const list = groups.get(sev) || [];
            if (!list.length) return "";
            const [label, cls] = severityLabel(sev);
            return `
              <section class="card">
                <div class="cardHead">
                  <div class="cardTitle">
                    <div class="nodeType">${escapeHtml(groupTitles[sev] || label)}</div>
                    <div class="severity ${escapeHtml(cls)}">${escapeHtml(label)}</div>
                  </div>
                </div>
                <div class="cardBody">
                  ${list.map(cardHtml).join("")}
                </div>
              </section>
            `;
          })
          .join("");
      }

      function resetUi() {
        document.getElementById("q").value = "";
        document.getElementById("onlyDiff").checked = true;
        document.getElementById("group").checked = false;
        render();
      }

      document.getElementById("q").addEventListener("input", render);
      document.getElementById("onlyDiff").addEventListener("change", render);
      document.getElementById("group").addEventListener("change", render);
      document.getElementById("reset").addEventListener("click", resetUi);

      render();
    </script>
  </body>
</html>
